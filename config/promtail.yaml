# Promtail Log Shipper Configuration

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: taxon-vision-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: taxon-vision
          service: api
          __path__: /var/log/app/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            status_code: status_code
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
