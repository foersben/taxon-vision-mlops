# ==============================================================================
# TaxonVision-MLOps System & Infrastructure Configuration
#
# ARCHITECTURAL CONFIGURATION BOUNDARY:
# - `/params.yaml` (Repository Root): Single source of truth for all DVC-tracked
#   machine learning hyperparameters, data splits, and statistical guarantees:
#     * ingestion: taxa_to_fetch, per_page
#     * model: extractor, image_size
#     * feature_extraction: batch_size, val_split, cal_split, test_split
#     * training: epochs, batch_size, learning_rate, weight_decay, cb_beta, tune
#     * export: quantize_int8
#     * conformal: alpha (0.05 / 95% coverage), min_confidence, ood_tpr
#     * evaluation: latency_sla_ms (25.0 ms fast-path SLA)
# - `config/default_config.yaml` (This File): Governs system runtime defaults,
#   HTTP service parameters, paths, model registry mappings, telemetry, and
#   external database infrastructure. Any overlapping keys defined in root `/params.yaml`
#   automatically override these defaults via `Settings._deep_merge`.
# ==============================================================================
service:
  name: "TaxonVision Service"
  version: "0.1.0"
  port: 8000
  host: "0.0.0.0"
  max_image_upload_bytes: 15728640  # 15 MB
  allowed_mime_types: ["image/jpeg", "image/png", "image/webp"]
  image_cache_max_items: 100        # ~20 MB RAM at ~200 KB per image
  image_cache_ttl_seconds: 900.0    # 15 minutes
  ui_top_k_candidates: 5

model:
  default_extractor: "dinov3"
  fallback_extractor: "mobilenetv4_conv_small.e2400_r224_in1k"
  available_extractors: ["bioclip-2", "dinov3", "dinov3_vits14", "dinov2_vits14", "mobilenetv4_conv_small", "efficientnet_b0"]
  image_size: 224
  channels: 3
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  onnx_model_path: "models/checkpoints/model_int8.onnx"
  head_checkpoint_path: "models/checkpoints/head.pt"
  taxa_catalog_path: "config/taxa_catalog.yaml"
  eval_resize_ratio: 1.1428571428571428
  calibration_dir: "data/sample"
  calibration_samples: 128
  inference_backend: "auto"
  quantization_mode: "auto"
  temperature: 1.0
  allow_untrained_fallback: false
  prefer_onnx_runtime: true
  onnx_opset_version: 17
  cam_numerical_epsilon: 1.0e-8
  ood_temperature: 1.0
  ood_energy_threshold: -2.40
  flagged_storage_dir: "data/flagged_observations"
  backbone_registry:
    bioclip-2: "hf-hub:imageomics/bioclip-2"
    dinov3: "vit_small_patch16_dinov3"
    dinov3_vits14: "vit_small_patch16_dinov3"
    dinov2_vits14: "vit_small_patch14_dinov2.lvd142m"
    mobilenetv4_conv_small: "mobilenetv4_conv_small.e2400_r224_in1k"
    efficientnet_b0: "efficientnet_b0.ra_in1k"

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  cb_beta: 0.9999
  dropout: 0.2
  noise_std: 0.01
  early_stopping_patience: 5
  reduce_lr_patience: 2
  warmup_epochs: 3
  val_split: 0.10
  cal_split: 0.10
  test_split: 0.10
  random_seed: 42
  extractor: "dinov3"
  tune: false

ingestion:
  taxa_to_fetch:
    - 48662
    - 47219
    - 12727
    - 8229
    - 47602
    - 57983
    - 47144
    - 42069
    - 48715
    - 48701
  per_page: 200

mlflow:
  tracking_uri: "https://dagshub.com/foersben/taxon-vision-mlops.mlflow"
  experiment_name: "taxon-vision-head-tuning"

conformal:
  alpha: 0.05
  k_max: 3
  quantile_threshold: 0.85
  nominal_coverage: 0.95
  method: "split-conformal"
  empty_set_action: "route_to_human_triage"
  min_confidence_threshold: 0.60

ood:
  energy_threshold: -2.40
  entropy_threshold: 1.60

streaming:
  http_max_retries: 5
  http_backoff_factor: 0.5
  http_max_connections: 16
  http_keepalive_connections: 8
  http_timeout_seconds: 15.0
  min_extraction_success_ratio: 0.95

optuna:
  optuna_storage_uri: "sqlite:///data/optuna/optuna_studies.db"
  optuna_study_prefix: "taxon_vision"
  n_trials: 30
  epochs: 30
  min_resource: 3
  reduction_factor: 2

evaluation:
  latency_sla_ms: 25.0
