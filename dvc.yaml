stages:
  ingestion:
    cmd: pixi run --frozen -e dev python scripts/ingest_data.py
    deps:
      - scripts/ingest_data.py
      - src/taxon_vision/data/inat_client.py
      - src/taxon_vision/data/license_filter.py
    params:
      - config/params.yaml:
        - ingestion.taxa_to_fetch
        - ingestion.per_page
    outs:
      - data/manifests
  train:
    cmd: pixi run --frozen -e dev python -m taxon_vision.models.trainer --epochs 5 --extractor mobilenetv4_conv_small
    deps:
      - data/manifests
      - src/taxon_vision/models/
    params:
      - config/params.yaml:
        - training.epochs
        - training.extractor
    outs:
      - models/checkpoints/head.pt
