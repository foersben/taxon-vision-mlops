apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared backing platform services, telemetry, and ingress (applied across cluster once).
# Environment-specific API workloads live in deploy/k8s/overlays/{staging,production}.
# Optional/one-off templates live in deploy/k8s/optional/ and are never auto-applied here.
resources:
  - k8s/postgres.yaml
  - k8s/loki-promtail.yaml
  - k8s/monitoring-prometheus-grafana.yaml
  - k8s/mlops-storage-and-optuna.yaml
  - k8s/evidently-ui.yaml
  - k8s/airflow.yaml
  - k8s/traefik-ingress.yaml

configMapGenerator:
  # Grafana hot-reloads dashboards and alerting rules dynamically without pod restarts.
  - name: grafana-alerting
    namespace: taxon-vision
    files:
      - grafana/provisioning/alerting/rules.yaml
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: taxon-vision-mlops

  - name: grafana-dashboards-provider
    namespace: taxon-vision
    files:
      - grafana/provisioning/dashboards/dashboards.yaml
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: taxon-vision-mlops

  - name: grafana-dashboards-json
    namespace: taxon-vision
    files:
      - grafana/provisioning/dashboards/json/infrastructure_overview.json
      - grafana/provisioning/dashboards/json/taxon_overview.json
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: taxon-vision-mlops

  # Hash suffix intentionally retained: Loki/Promtail do not hot-reload config edits.
  - name: loki-promtail-config
    namespace: taxon-vision
    files:
      - loki.yaml=loki/loki.yaml
      - promtail.yaml=k8s/promtail.yaml
    options:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: taxon-vision-mlops

  # Shared PostgreSQL cluster initdb scripts (roles/DBs + telemetry schema DDL).
  - name: postgres-init-sql
    namespace: taxon-vision
    files:
      - postgres/k8s-init/01-databases.sh
      - postgres/init/02-telemetry.sql
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: taxon-vision-mlops
