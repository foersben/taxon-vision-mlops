apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxon-vision-serving
  labels:
    app.kubernetes.io/name: taxon-vision-serving
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: taxon-vision-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxon-vision-serving
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
      - name: init-permissions
        image: busybox:1.36
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        command:
        - sh
        - -c
        - mkdir -p /app/data/flagged_observations /var/lib/taxon-vision/evidently && chown -R 10001:10001 /app/data/flagged_observations /var/lib/taxon-vision/evidently
        volumeMounts:
        - name: flagged-observations-volume
          mountPath: /app/data/flagged_observations
        - name: evidently-workspace-volume
          mountPath: /var/lib/taxon-vision/evidently
      containers:
      - name: api-service
        image: ghcr.io/foersben/taxon-vision-mlops
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]
        env:
        - name: TAXON_SERVICE__PORT
          value: "8000"
        - name: TAXON_SERVICE__HOST
          value: "0.0.0.0"
        - name: TAXON_SERVICE__REDIS_URL
          value: "redis://redis-ephemeral.taxon-vision.svc.cluster.local:6379/0"
        - name: TAXON_TELEMETRY_ALLOW_IN_MEMORY_FALLBACK
          value: "true"
        - name: TAXON_TELEMETRY__ALLOW_IN_MEMORY_FALLBACK
          value: "true"
        - name: TAXON_OPTUNA__OPTUNA_STORAGE_URI
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: OPTUNA_STORAGE_URI
        - name: TAXON_AIRFLOW_URL
          value: "http://airflow-apiserver.taxon-vision.svc.cluster.local:8080"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-server.taxon-vision.svc.cluster.local:5000"
        - name: TAXON_AIRFLOW_USER
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: AIRFLOW_API_USER
        - name: TAXON_AIRFLOW_PASSWORD
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: AIRFLOW_API_PASSWORD
        - name: TAXON_ALLOW_UNTRAINED_FALLBACK
          value: "false"
        - name: TAXON_STRUCTURED_STDOUT
          value: "true"
        - name: TAXON_DRIFT__REFERENCE_EMBEDDINGS_PATH
          value: "/app/data/embeddings/cal_embeddings.pt"
        - name: TAXON_DRIFT__EVIDENTLY_WORKSPACE_DIR
          value: "/var/lib/taxon-vision/evidently"
        - name: TAXON_TAXA_CATALOG_PATH
          value: "/app/models/checkpoints/taxa_catalog.yaml"
        - name: TAXON_CONFORMAL_CONFIG_PATH
          value: "/app/models/checkpoints/conformal_config.yaml"
        - name: TAXON_TELEMETRY__DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: TELEMETRY_DATABASE_URL
        - name: TAXON_INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: INTERNAL_API_TOKEN
        - name: TAXON_RETRAIN_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: RETRAIN_WEBHOOK_SECRET
        - name: DAGSHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: DAGSHUB_TOKEN
              optional: true
        resources:
          requests:
            cpu: "200m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: checkpoints-volume
          mountPath: /app/models/checkpoints
          readOnly: true
        - name: reference-volume
          mountPath: /app/data/embeddings
          readOnly: true
        - name: flagged-observations-volume
          mountPath: /app/data/flagged_observations
        - name: evidently-workspace-volume
          mountPath: /var/lib/taxon-vision/evidently
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: checkpoints-volume
        hostPath:
          path: /var/lib/taxon-vision/checkpoints
          type: DirectoryOrCreate
      - name: reference-volume
        hostPath:
          path: /var/lib/taxon-vision/reference
          type: DirectoryOrCreate
      - name: flagged-observations-volume
        hostPath:
          path: /var/lib/taxon-vision/flagged_observations
          type: DirectoryOrCreate
      - name: evidently-workspace-volume
        hostPath:
          path: /var/lib/taxon-vision/evidently
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: taxon-vision-serving
  labels:
    app.kubernetes.io/name: taxon-vision-serving
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: taxon-vision-serving
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: 30080
    protocol: TCP
