apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxon-vision-serving
  labels:
    app.kubernetes.io/name: taxon-vision-serving
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: taxon-vision-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxon-vision-serving
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: api-service
        image: ghcr.io/foersben/taxon-vision-mlops
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]
        env:
        - name: TAXON_SERVICE__PORT
          value: "8000"
        - name: TAXON_SERVICE__HOST
          value: "0.0.0.0"
        - name: TAXON_SERVICE__REDIS_URL
          value: "redis://redis-ephemeral.taxon-vision.svc.cluster.local:6379/0"
        - name: TAXON_TELEMETRY_ALLOW_IN_MEMORY_FALLBACK
          value: "true"
        - name: TAXON_TELEMETRY__ALLOW_IN_MEMORY_FALLBACK
          value: "true"
        - name: TAXON_OPTUNA__OPTUNA_STORAGE_URI
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: OPTUNA_STORAGE_URI
        - name: TAXON_TELEMETRY__DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: TELEMETRY_DATABASE_URL
        - name: TAXON_INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: INTERNAL_API_TOKEN
        - name: TAXON_RETRAIN_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: taxon-vision-secrets
              key: RETRAIN_WEBHOOK_SECRET
        resources:
          requests:
            cpu: "200m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: checkpoints-volume
          mountPath: /app/models/checkpoints
          readOnly: true
        - name: flagged-observations-volume
          mountPath: /app/data/flagged_observations
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: checkpoints-volume
        hostPath:
          path: /var/lib/taxon-vision/checkpoints
          type: DirectoryOrCreate
      - name: flagged-observations-volume
        hostPath:
          path: /var/lib/taxon-vision/flagged_observations
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: taxon-vision-serving
  labels:
    app.kubernetes.io/name: taxon-vision-serving
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taxon-vision-serving
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
