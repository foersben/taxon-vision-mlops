apiVersion: v1
kind: Pod
metadata:
  namespace: jenkins-ci
  labels:
    app.kubernetes.io/name: taxon-vision-jenkins-gpu-agent
spec:
  serviceAccountName: jenkins-agent
  containers:
  - name: ml-runner
    image: ghcr.io/prefix-dev/pixi:latest
    command: ["sleep"]
    args: ["99d"]
    tty: true
    volumeMounts:
    - name: rattler-cache
      mountPath: /root/.cache/rattler/cache
    - name: hf-cache
      mountPath: /root/.cache/huggingface
    - name: optuna-studies
      mountPath: /workspace/optuna
    - name: host-embeddings
      mountPath: /var/lib/taxon-vision/embeddings
    - name: host-manifests
      mountPath: /var/lib/taxon-vision/manifests
    - name: host-checkpoints
      mountPath: /var/lib/taxon-vision/checkpoints
    resources:
      limits:
        memory: "16Gi"
        cpu: "8"
        nvidia.com/gpu: "1"
      requests:
        memory: "2Gi"
        cpu: "1000m"
        nvidia.com/gpu: "1"
  volumes:
  - name: rattler-cache
    hostPath:
      path: /var/lib/taxon-vision/rattler-cache
      type: DirectoryOrCreate
  - name: hf-cache
    hostPath:
      path: /var/lib/taxon-vision/hf-cache
      type: DirectoryOrCreate
  - name: optuna-studies
    hostPath:
      path: /var/lib/taxon-vision/optuna
      type: DirectoryOrCreate
  - name: host-embeddings
    hostPath:
      path: /var/lib/taxon-vision/embeddings
      type: DirectoryOrCreate
  - name: host-manifests
    hostPath:
      path: /var/lib/taxon-vision/manifests
      type: DirectoryOrCreate
  - name: host-checkpoints
    hostPath:
      path: /var/lib/taxon-vision/checkpoints
      type: DirectoryOrCreate
