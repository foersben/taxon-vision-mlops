apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: taxon-vision-mlops
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "taxon-operator",
          "credentials": [
            {
              "accessKey": "taxonadmin",
              "secretKey": "taxonadmin"
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
      - name: seaweedfs
        image: docker.io/chrislusf/seaweedfs:latest
        args:
        - "server"
        - "-dir=/data"
        - "-s3"
        - "-s3.port=8333"
        - "-s3.config=/etc/seaweedfs/s3.json"
        - "-s3.allowEmptyFolder=true"
        - "-volume.max=20"
        ports:
        - name: s3-api
          containerPort: 8333
        - name: master
          containerPort: 9333
        - name: filer
          containerPort: 8888
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                until wget -q -O - http://127.0.0.1:8888/ >/dev/null 2>&1; do sleep 1; done;
                wget -q -O - --post-data="" "http://127.0.0.1:8888/buckets/taxon-dvc-cache/?op=mkdir" || true;
                wget -q -O - --post-data="" "http://127.0.0.1:8888/buckets/triage-queue/?op=mkdir" || true;
        volumeMounts:
        - name: seaweedfs-storage
          mountPath: /data
        - name: s3-config
          mountPath: /etc/seaweedfs
      volumes:
      - name: seaweedfs-storage
        hostPath:
          path: /var/lib/taxon-vision/seaweedfs
          type: DirectoryOrCreate
      - name: s3-config
        configMap:
          name: seaweedfs-s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
  - name: s3-api
    port: 8333
    targetPort: 8333
  - name: filer-web
    port: 8888
    targetPort: 8888
  - name: master-ui
    port: 9333
    targetPort: 9333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optuna-dashboard
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: optuna-dashboard
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: optuna-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: optuna-dashboard
    spec:
      containers:
      - name: optuna-dashboard
        image: ghcr.io/optuna/optuna-dashboard:latest
        args:
        - "sqlite:////workspace/optuna/optuna_studies.db"
        - "--port"
        - "8080"
        - "--host"
        - "0.0.0.0"
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: optuna-storage
          mountPath: /workspace/optuna
      volumes:
      - name: optuna-storage
        hostPath:
          path: /var/lib/taxon-vision/optuna
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: optuna-dashboard
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: optuna-dashboard
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: optuna-dashboard
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30081
