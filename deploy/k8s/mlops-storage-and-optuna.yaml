apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
      - name: seaweedfs
        image: docker.io/chrislusf/seaweedfs:latest
        args:
        - "server"
        - "-dir=/data"
        - "-s3"
        - "-s3.port=8333"
        - "-s3.config=/etc/seaweedfs/s3.json"
        - "-s3.allowEmptyFolder=true"
        - "-volume.max=20"
        ports:
        - name: s3-api
          containerPort: 8333
        - name: master
          containerPort: 9333
        - name: filer
          containerPort: 8888
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                until wget -q -O - http://127.0.0.1:8888/ >/dev/null 2>&1; do sleep 1; done;
                wget -q -O - --post-data="" "http://127.0.0.1:8888/buckets/taxon-dvc-cache/?op=mkdir" || true;
                wget -q -O - --post-data="" "http://127.0.0.1:8888/buckets/triage-queue/?op=mkdir" || true;
                wget -q -O - --post-data="" "http://127.0.0.1:8888/buckets/mlflow-artifacts/?op=mkdir" || true;
        volumeMounts:
        - name: seaweedfs-storage
          mountPath: /data
        - name: s3-config
          mountPath: /etc/seaweedfs
      volumes:
      - name: seaweedfs-storage
        hostPath:
          path: /var/lib/taxon-vision/seaweedfs
          type: DirectoryOrCreate
      - name: s3-config
        secret:
          secretName: seaweedfs-s3-secret
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
  - name: s3-api
    port: 8333
    targetPort: 8333
  - name: filer-web
    port: 8888
    targetPort: 8888
  - name: master-ui
    port: 9333
    targetPort: 9333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optuna-dashboard
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: optuna-dashboard
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: optuna-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: optuna-dashboard
    spec:
      containers:
      - name: optuna-dashboard
        image: ghcr.io/optuna/optuna-dashboard:latest
        env:
        - name: OPTUNA_DASHBOARD_STORAGE_URI
          valueFrom:
            secretKeyRef:
              name: optuna-secrets
              key: OPTUNA_DASHBOARD_STORAGE_URI
        args:
        - "$(OPTUNA_DASHBOARD_STORAGE_URI)"
        - "--port"
        - "8080"
        - "--host"
        - "0.0.0.0"
        ports:
        - name: http
          containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: optuna-dashboard
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: optuna-dashboard
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: optuna-dashboard
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: mlflow-server
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-server
    spec:
      containers:
      - name: mlflow-server
        image: ghcr.io/mlflow/mlflow:v3.16.0
        command:
        - /bin/sh
        - -c
        - |
          pip install --no-cache-dir psycopg2-binary boto3 &&
          mlflow server \
            --backend-store-uri "${MLFLOW_BACKEND_STORE_URI}" \
            --artifacts-destination s3://mlflow-artifacts \
            --serve-artifacts \
            --allowed-hosts "*" \
            --host 0.0.0.0 \
            --port 5000
        env:
        - name: MLFLOW_BACKEND_STORE_URI
          valueFrom:
            secretKeyRef:
              name: mlflow-secrets
              key: MLFLOW_BACKEND_URI
        - name: MLFLOW_S3_ENDPOINT_URL
          value: "http://seaweedfs.taxon-vision.svc.cluster.local:8333"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: seaweedfs-s3-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: seaweedfs-s3-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        ports:
        - name: http
          containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-server
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: mlflow-server
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mlflow-server
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30500
