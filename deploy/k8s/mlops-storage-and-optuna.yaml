apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
      - name: minio
        image: elestio/minio:latest
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        ports:
        - name: s3-api
          containerPort: 9000
        - name: console
          containerPort: 9001
        volumeMounts:
        - name: minio-storage
          mountPath: /data
      - name: create-buckets
        image: elestio/minio:latest
        command:
        - /bin/sh
        - -c
        - |
          until (/usr/bin/mc alias set local http://localhost:9000 minioadmin minioadmin); do echo 'Waiting for MinIO...'; sleep 1; done;
          /usr/bin/mc mb --ignore-existing local/taxon-dvc-cache;
          /usr/bin/mc mb --ignore-existing local/triage-queue;
          echo 'Buckets created successfully';
          sleep infinity;
      volumes:
      - name: minio-storage
        hostPath:
          path: /var/lib/taxon-vision/minio
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
  - name: s3-api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optuna-dashboard
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: optuna-dashboard
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: optuna-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: optuna-dashboard
    spec:
      containers:
      - name: optuna-dashboard
        image: ghcr.io/optuna/optuna-dashboard:latest
        args:
        - "sqlite:////workspace/optuna/optuna_studies.db"
        - "--port"
        - "8080"
        - "--host"
        - "0.0.0.0"
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: optuna-storage
          mountPath: /workspace/optuna
      volumes:
      - name: optuna-storage
        hostPath:
          path: /var/lib/taxon-vision/optuna
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: optuna-dashboard
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: optuna-dashboard
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: optuna-dashboard
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30081
