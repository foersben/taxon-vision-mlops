apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-ephemeral
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: redis-ephemeral
    app.kubernetes.io/part-of: taxon-vision-mlops
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-ephemeral
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-ephemeral
        app.kubernetes.io/component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - redis-server
        - "--maxmemory"
        - "64mb"
        - "--maxmemory-policy"
        - "allkeys-lru"
        - "--save"
        - ""
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-ephemeral
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: redis-ephemeral
    app.kubernetes.io/part-of: taxon-vision-mlops
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-ephemeral
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
