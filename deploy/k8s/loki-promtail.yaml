apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      initContainers:
      - name: fix-loki-permissions
        image: docker.io/busybox:1.36
        command: ["sh", "-c", "mkdir -p /loki/chunks /loki/rules /loki/compactor && chown -R 10001:10001 /loki && chmod -R 775 /loki"]
        volumeMounts:
        - name: storage
          mountPath: /loki
      containers:
      - name: loki
        image: docker.io/grafana/loki:3.0.0
        args:
        - "-config.file=/etc/loki/loki.yaml"
        ports:
        - name: http
          containerPort: 3100
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: storage
          mountPath: /loki
      volumes:
      - name: config
        configMap:
          name: loki-promtail-config
          items:
          - key: loki.yaml
            path: loki.yaml
      - name: storage
        hostPath:
          path: /var/lib/taxon-vision/loki
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
    protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
    spec:
      containers:
      - name: promtail
        image: docker.io/grafana/promtail:3.0.0
        args:
        - "-config.file=/etc/promtail/promtail.yaml"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true
        - name: varlibcontainerd
          mountPath: /var/lib/rancher/k3s/agent/containerd/io.containerd.runtime.v2.task/k8s.io
          readOnly: true
        - name: positions
          mountPath: /positions
      volumes:
      - name: config
        configMap:
          name: loki-promtail-config
          items:
          - key: promtail.yaml
            path: promtail.yaml
      - name: varlogpods
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: varlibcontainerd
        hostPath:
          path: /var/lib/rancher/k3s/agent/containerd/io.containerd.runtime.v2.task/k8s.io
          type: DirectoryOrCreate
      - name: positions
        hostPath:
          path: /var/lib/taxon-vision/promtail-positions
          type: DirectoryOrCreate
