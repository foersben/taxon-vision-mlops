apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-promtail-config
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: taxon-vision-mlops
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h
      max_query_length: 721h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 6

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem

  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /positions/positions.yaml

    clients:
      - url: http://loki.taxon-vision.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: taxon-vision-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: taxon-vision
              __path__: /var/log/pods/taxon-vision*/*/*.log
        pipeline_stages:
          - cri: {}
          - regex:
              source: filename
              expression: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/.*\.log'
          - labels:
              namespace:
              container:
          - match:
              selector: '{container="api-service"}'
              stages:
                - json:
                    expressions:
                      level: level
                      logger: logger
                      event: event
                      request_id: request_id
                      ood_flagged: ood_flagged
                      human_review: human_review
                - labels:
                    level:
                    event:
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      initContainers:
      - name: fix-loki-permissions
        image: docker.io/busybox:1.36
        command: ["sh", "-c", "mkdir -p /loki/chunks /loki/rules /loki/compactor && chown -R 10001:10001 /loki && chmod -R 775 /loki"]
        volumeMounts:
        - name: storage
          mountPath: /loki
      containers:
      - name: loki
        image: docker.io/grafana/loki:3.0.0
        args:
        - "-config.file=/etc/loki/loki.yaml"
        ports:
        - name: http
          containerPort: 3100
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: storage
          mountPath: /loki
      volumes:
      - name: config
        configMap:
          name: loki-promtail-config
          items:
          - key: loki.yaml
            path: loki.yaml
      - name: storage
        hostPath:
          path: /var/lib/taxon-vision/loki
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
    protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
    spec:
      containers:
      - name: promtail
        image: docker.io/grafana/promtail:3.0.0
        args:
        - "-config.file=/etc/promtail/promtail.yaml"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true
        - name: varlibcontainerd
          mountPath: /var/lib/rancher/k3s/agent/containerd/io.containerd.runtime.v2.task/k8s.io
          readOnly: true
        - name: positions
          mountPath: /positions
      volumes:
      - name: config
        configMap:
          name: loki-promtail-config
          items:
          - key: promtail.yaml
            path: promtail.yaml
      - name: varlogpods
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: varlibcontainerd
        hostPath:
          path: /var/lib/rancher/k3s/agent/containerd/io.containerd.runtime.v2.task/k8s.io
          type: DirectoryOrCreate
      - name: positions
        hostPath:
          path: /var/lib/taxon-vision/promtail-positions
          type: DirectoryOrCreate
