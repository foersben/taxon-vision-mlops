apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: taxon-vision-ingress
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: taxon-vision-ingress
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  entryPoints:
    - web
  routes:
    # --------------------------------------------------------------------------
    # Dashboard Routes (Optuna, Grafana, Evidently)
    # --------------------------------------------------------------------------
    - match: PathPrefix(`/optuna`) || Host(`optuna.taxon.benjamin-foerster.eu`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-optuna
      services:
        - name: optuna-dashboard
          port: 8080
    - match: PathPrefix(`/grafana`) || Host(`grafana.taxon.benjamin-foerster.eu`)
      kind: Rule
      priority: 100
      services:
        - name: grafana
          port: 3000
    - match: PathPrefix(`/evidently`) || Host(`evidently.taxon.benjamin-foerster.eu`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-evidently
      services:
        - name: evidently-ui
          port: 8000
    # --------------------------------------------------------------------------
    # Apache Airflow 3 Orchestration Console (Host-based Routing)
    # --------------------------------------------------------------------------
    - match: Host(`airflow.taxon.benjamin-foerster.eu`)
      kind: Rule
      priority: 100
      services:
        - name: airflow-apiserver
          port: 8080

    # --------------------------------------------------------------------------
    # Production Model Serving & Operator Dashboard (Always Warm)
    # --------------------------------------------------------------------------
    - match: Host(`taxon.benjamin-foerster.eu`)
      kind: Rule
      priority: 10
      services:
        - name: taxon-vision-serving
          port: 8000
---
# ==============================================================================
# Traefik Path-Stripping Middlewares
# ==============================================================================
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-optuna
  namespace: taxon-vision
spec:
  stripPrefix:
    prefixes:
      - "/optuna"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-evidently
  namespace: taxon-vision
spec:
  stripPrefix:
    prefixes:
      - "/evidently"
