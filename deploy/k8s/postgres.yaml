apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taxon-vision-mlops
data:
  01-databases.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "${POSTGRES_USER}" --dbname "${POSTGRES_DB}" \
      -v telemetry_pw="${TELEMETRY_DB_PASSWORD}" \
      -v optuna_pw="${OPTUNA_DB_PASSWORD}" \
      -v airflow_pw="${AIRFLOW_DB_PASSWORD}" <<'EOSQL'
    CREATE ROLE telemetry LOGIN PASSWORD :'telemetry_pw';
    CREATE ROLE optuna    LOGIN PASSWORD :'optuna_pw';
    CREATE ROLE airflow   LOGIN PASSWORD :'airflow_pw';

    CREATE DATABASE telemetry OWNER telemetry;
    CREATE DATABASE optuna    OWNER optuna;
    CREATE DATABASE airflow   OWNER airflow;

    GRANT ALL PRIVILEGES ON DATABASE telemetry TO telemetry;
    GRANT ALL PRIVILEGES ON DATABASE optuna    TO optuna;
    GRANT ALL PRIVILEGES ON DATABASE airflow   TO airflow;
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        appArmorProfile:
          type: Unconfined
      containers:
      - name: postgres
        image: postgres:16-alpine
        args:
          - "-c"
          - "shared_buffers=128MB"
          - "-c"
          - "max_connections=120"
          - "-c"
          - "work_mem=4MB"
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_PASSWORD
        - name: TELEMETRY_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: TELEMETRY_DB_PASSWORD
        - name: OPTUNA_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: OPTUNA_DB_PASSWORD
        - name: AIRFLOW_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: AIRFLOW_DB_PASSWORD
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        ports:
        - name: postgres
          containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        startupProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 20
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        hostPath:
          path: /var/lib/taxon-vision/postgres
          type: DirectoryOrCreate
      - name: init-sql
        configMap:
          name: postgres-init-sql
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    nodePort: 30432
