# Example structure only - do NOT store real credentials here.
# Generate real cluster Secrets out-of-band via:
#   bash scripts/deploy/provision_k8s_secrets.sh --init-env --env-file /etc/taxon-vision/production.env
#   bash scripts/deploy/provision_k8s_secrets.sh --env-file /etc/taxon-vision/production.env

apiVersion: v1
kind: Secret
metadata:
  name: dagshub-credentials
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: dagshub-credentials
    app.kubernetes.io/part-of: taxon-vision-mlops
type: Opaque
stringData:
  username: "foersben"
  token: "REPLACE_WITH_YOUR_DAGSHUB_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: taxon-vision
  labels:
    app.kubernetes.io/part-of: taxon-vision-mlops
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_POSTGRES_SUPERUSER_PASSWORD"
  TELEMETRY_DB_PASSWORD: "REPLACE_WITH_TELEMETRY_DB_PASSWORD"
  OPTUNA_DB_PASSWORD: "REPLACE_WITH_OPTUNA_DB_PASSWORD"
  AIRFLOW_DB_PASSWORD: "REPLACE_WITH_AIRFLOW_DB_PASSWORD"
  MLFLOW_DB_PASSWORD: "REPLACE_WITH_MLFLOW_DB_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-secret
  namespace: taxon-vision
  labels:
    app.kubernetes.io/part-of: taxon-vision-mlops
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_SEAWEEDFS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_SEAWEEDFS_SECRET_KEY"
  s3.json: |
    {
      "identities": [
        {
          "name": "taxon-operator",
          "credentials": [
            {
              "accessKey": "REPLACE_WITH_SEAWEEDFS_ACCESS_KEY",
              "secretKey": "REPLACE_WITH_SEAWEEDFS_SECRET_KEY"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secrets
  namespace: taxon-vision
  labels:
    app.kubernetes.io/part-of: taxon-vision-mlops
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "REPLACE_WITH_GRAFANA_ADMIN_PASSWORD"
  GF_RETRAIN_WEBHOOK_SECRET: "REPLACE_WITH_RETRAIN_WEBHOOK_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secrets
  namespace: taxon-vision
  labels:
    app.kubernetes.io/part-of: taxon-vision-mlops
type: Opaque
stringData:
  MLFLOW_BACKEND_URI: "postgresql+psycopg2://mlflow:REPLACE_WITH_MLFLOW_DB_PASSWORD@postgres.taxon-vision.svc.cluster.local:5432/mlflow"
---
apiVersion: v1
kind: Secret
metadata:
  name: optuna-secrets
  namespace: taxon-vision
  labels:
    app.kubernetes.io/part-of: taxon-vision-mlops
type: Opaque
stringData:
  OPTUNA_DASHBOARD_STORAGE_URI: "postgresql+psycopg2://optuna:REPLACE_WITH_OPTUNA_DB_PASSWORD@postgres.taxon-vision.svc.cluster.local:5432/optuna"
---
apiVersion: v1
kind: Secret
metadata:
  name: taxon-vision-secrets
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: taxon-vision-secrets
    app.kubernetes.io/part-of: taxon-vision-mlops
type: Opaque
stringData:
  INTERNAL_API_TOKEN: "REPLACE_WITH_INTERNAL_API_TOKEN"
  OPTUNA_STORAGE_URI: "postgresql+psycopg://optuna:REPLACE_WITH_OPTUNA_DB_PASSWORD@postgres.taxon-vision.svc.cluster.local:5432/optuna"
  RETRAIN_WEBHOOK_SECRET: "REPLACE_WITH_RETRAIN_WEBHOOK_SECRET"
  TELEMETRY_DATABASE_URL: "postgresql+psycopg://telemetry:REPLACE_WITH_TELEMETRY_DB_PASSWORD@postgres.taxon-vision.svc.cluster.local:5432/telemetry"
  AIRFLOW_API_USER: "admin"
  AIRFLOW_API_PASSWORD: "REPLACE_WITH_AIRFLOW_ADMIN_PASSWORD"
  DAGSHUB_TOKEN: "REPLACE_WITH_DAGSHUB_PAT_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: airflow-secrets
    app.kubernetes.io/part-of: taxon-vision-mlops
type: Opaque
stringData:
  AIRFLOW__CORE__FERNET_KEY: "REPLACE_WITH_BASE64_32BYTE_FERNET_KEY"
  AIRFLOW__API_AUTH__JWT_SECRET: "REPLACE_WITH_RANDOM_JWT_SIGNING_SECRET"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:REPLACE_WITH_AIRFLOW_DB_PASSWORD@postgres.taxon-vision.svc.cluster.local:5432/airflow"
  AIRFLOW_ADMIN_PASSWORD: "REPLACE_WITH_AIRFLOW_ADMIN_PASSWORD"
  JENKINS_USER: "admin"
  JENKINS_API_TOKEN: "REPLACE_WITH_JENKINS_ADMIN_API_TOKEN"
  DAGSHUB_TOKEN: "REPLACE_WITH_DAGSHUB_PAT_TOKEN"
