apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxon-vision-serving
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      containers:
      - name: api-service
        resources:
          requests:
            cpu: "200m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
