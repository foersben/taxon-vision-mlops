apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: taxon-vision-staging-ingress
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`staging.taxon.benjamin-foerster.eu`)
      kind: Rule
      priority: 100
      services:
        - name: taxon-vision-serving
          port: 8000
  tls: {}
