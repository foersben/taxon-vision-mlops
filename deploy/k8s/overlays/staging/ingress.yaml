apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sablier-staging
spec:
  plugin:
    sablier:
      sablierUrl: http://sablier.taxon-vision.svc.cluster.local:10000
      names: "deployment_taxon-vision-staging_taxon-vision-serving_1"
      sessionDuration: "15m"
      dynamic:
        displayName: "TaxonVision Staging API"
        theme: "ghost"
        refreshFrequency: "2s"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: taxon-vision-staging-ingress
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`staging.taxon.benjamin-foerster.eu`)
      kind: Rule
      middlewares:
        - name: sablier-staging
      services:
        - name: taxon-vision-serving
          port: 8000
  tls: {}
