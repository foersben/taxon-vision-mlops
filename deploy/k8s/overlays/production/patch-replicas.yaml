apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxon-vision-serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      containers:
      - name: api-service
        resources:
          requests:
            cpu: "200m"
            memory: "1Gi"
            nvidia.com/gpu: 1
          limits:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: 1
