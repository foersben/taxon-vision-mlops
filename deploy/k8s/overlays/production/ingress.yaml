apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: taxon-vision-production-ingress
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`taxon.benjamin-foerster.eu`) || PathPrefix(`/`)
      kind: Rule
      priority: 10
      services:
        - name: taxon-vision-serving
          port: 8000
