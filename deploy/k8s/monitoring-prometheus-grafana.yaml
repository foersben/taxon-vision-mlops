apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: taxon-vision-mlops
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    scrape_configs:
      - job_name: 'taxon-vision-serving'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['taxon-vision']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: taxon-vision-serving
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: taxon-vision-mlops
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki.taxon-vision.svc.cluster.local:3100
        editable: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: taxon-vision-mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-sd
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: taxon-vision-mlops
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-sd
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: taxon-vision-mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-sd
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: taxon-vision
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      initContainers:
      - name: fix-permissions
        image: docker.io/busybox:1.36
        command: ["sh", "-c", "chown -R 65534:65534 /prometheus && chmod -R 775 /prometheus"]
        volumeMounts:
        - name: storage
          mountPath: /prometheus
      containers:
      - name: prometheus
        image: docker.io/prom/prometheus:v3.16.0
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=15d"
        - "--web.enable-lifecycle"
        ports:
        - name: web
          containerPort: 9090
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1024Mi"
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: storage
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: storage
        hostPath:
          path: /var/lib/taxon-vision/prometheus
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
  - name: web
    port: 9090
    targetPort: 9090
    nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        fsGroup: 472
      initContainers:
      - name: fix-permissions
        image: docker.io/busybox:1.36
        command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana && chmod -R 775 /var/lib/grafana"]
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
      containers:
      - name: grafana
        image: docker.io/grafana/grafana:13.3.2
        ports:
        - name: web
          containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: monitoring-secrets
              key: GF_SECURITY_ADMIN_USER
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: monitoring-secrets
              key: GF_SECURITY_ADMIN_PASSWORD
        - name: GF_RETRAIN_WEBHOOK_URL
          value: "http://taxon-vision-serving.taxon-vision.svc.cluster.local:8000/api/v1/retrain/webhook"
        - name: GF_RETRAIN_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: monitoring-secrets
              key: GF_RETRAIN_WEBHOOK_SECRET
              optional: true
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1024Mi"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
        - name: dashboard-definitions
          mountPath: /etc/grafana/provisioning/dashboards/json
        - name: alerting-rules
          mountPath: /etc/grafana/provisioning/alerting/rules.yaml
          subPath: rules.yaml
      volumes:
      - name: grafana-storage
        hostPath:
          path: /var/lib/taxon-vision/grafana
          type: DirectoryOrCreate
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provider
        configMap:
          name: grafana-dashboards-provider
      - name: dashboard-definitions
        configMap:
          name: grafana-dashboards-json
      - name: alerting-rules
        configMap:
          name: grafana-alerting
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
  - name: web
    port: 3000
    targetPort: 3000
    nodePort: 30300
