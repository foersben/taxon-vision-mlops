apiVersion: v1
kind: ServiceAccount
metadata:
  name: sablier
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: sablier
    app.kubernetes.io/part-of: taxon-vision-mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sablier-cluster-role
  labels:
    app.kubernetes.io/name: sablier
    app.kubernetes.io/part-of: taxon-vision-mlops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "clusters/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sablier-cluster-binding
  labels:
    app.kubernetes.io/name: sablier
    app.kubernetes.io/part-of: taxon-vision-mlops
subjects:
  - kind: ServiceAccount
    name: sablier
    namespace: taxon-vision
roleRef:
  kind: ClusterRole
  name: sablier-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sablier
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: sablier
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sablier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sablier
    spec:
      serviceAccountName: sablier
      containers:
        - name: sablier
          image: ghcr.io/sablierapp/sablier:latest
          args:
            - "start"
            - "--provider.name=kubernetes"
            - "--provider.kubernetes.ready-on-first-replica"
            - "--sessions.default-duration=15m"
          ports:
            - name: http
              containerPort: 10000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 10000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sablier
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: sablier
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sablier
  ports:
    - name: http
      port: 10000
      targetPort: 10000
