apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: taxon-vision-mlops
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "TaxonVision Dashboards"
        orgId: 1
        folder: "TaxonVision"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-json
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: taxon-vision-mlops
data:
  infrastructure_overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "dashboard",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": false,
          "title": "MLOps & Production Overview",
          "tooltip": "Switch to Model Performance & Statistical Drift Dashboard",
          "type": "link",
          "url": "/d/taxon_overview"
        }
      ],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Memory Discipline & Leak Analysis",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "mbytes",
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" }
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 1 },
          "id": 2,
          "title": "Process Resident Memory (RSS)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "process_resident_memory_bytes / 1024 / 1024",
              "legendFormat": "RSS Memory (MiB)",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 500 },
                  { "color": "red", "value": 5000 }
                ]
              }
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 1 },
          "id": 3,
          "title": "Memory Leak Slope (15m Derivative)",
          "type": "stat",
          "targets": [
            {
              "expr": "deriv(process_resident_memory_bytes[15m])",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 1 },
          "id": 4,
          "title": "Process RAM vs 128 GB Host DDR5",
          "type": "gauge",
          "targets": [
            {
              "expr": "(process_resident_memory_bytes / 137438953472) * 100",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 8 },
          "id": 5,
          "title": "Computational Compute & CPU Invariants (Intel i7-14700K)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth" }
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 9 },
          "id": 6,
          "title": "Active CPU Core Utilization",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total[1m])",
              "legendFormat": "CPU Cores",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "drawStyle": "line" }
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 9 },
          "id": 7,
          "title": "CPU Computational Cost per Prediction",
          "type": "timeseries",
          "targets": [
            {
              "expr": "1000 * (rate(process_cpu_seconds_total[1m]) / clamp_min(rate(taxon_predictions_total[1m]), 1e-4))",
              "legendFormat": "CPU Time (ms/req)",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null }
                ]
              }
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 9 },
          "id": 8,
          "title": "Throughput Efficiency (Req/s per Core)",
          "type": "stat",
          "targets": [
            {
              "expr": "(sum(rate(taxon_predictions_total[1m])) or vector(0)) / clamp_min(rate(process_cpu_seconds_total[1m]), 1e-4)",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 },
          "id": 9,
          "title": "GPU Silicon & VRAM Invariants (NVIDIA RTX 5070 Ti 16 GB)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "mbytes",
              "custom": { "drawStyle": "line" }
            }
          },
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 17 },
          "id": 10,
          "title": "Inference VRAM Allocation vs 4.8 GB Serving Ceiling",
          "type": "timeseries",
          "targets": [
            {
              "expr": "taxon_hardware_gpu_memory_allocated_bytes / 1024 / 1024",
              "legendFormat": "Allocated VRAM",
              "refId": "A"
            },
            {
              "expr": "taxon_hardware_gpu_memory_reserved_bytes / 1024 / 1024",
              "legendFormat": "PyTorch Reserved VRAM",
              "refId": "B"
            },
            {
              "expr": "taxon_hardware_gpu_serving_budget_bytes / 1024 / 1024",
              "legendFormat": "Serving Envelope Ceiling (4.8 GB)",
              "refId": "C"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 75 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 17 },
          "id": 11,
          "title": "Serving VRAM Envelope Utilization",
          "type": "gauge",
          "targets": [
            {
              "expr": "(taxon_hardware_gpu_memory_allocated_bytes / 5153960755) * 100",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 25 },
          "id": 12,
          "title": "OS Resource Handles & Descriptor Limits",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line" }
            }
          },
          "gridPos": { "h": 7, "w": 16, "x": 0, "y": 26 },
          "id": 13,
          "title": "Open File Descriptors (Sockets & Stream Handles)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "process_open_fds",
              "legendFormat": "Active FDs",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 80 }
                ]
              }
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 26 },
          "id": 14,
          "title": "File Descriptor Capacity %",
          "type": "stat",
          "targets": [
            {
              "expr": "(process_open_fds / clamp_min(process_max_fds, 1)) * 100",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["taxon-vision", "mlops", "hardware", "infrastructure"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "TaxonVision Infrastructure & Hardware Invariants",
      "uid": "hardware_invariants",
      "version": 1
    }
  taxon_overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "dashboard",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": false,
          "title": "Hardware Invariants & Silicon Telemetry",
          "tooltip": "Switch to Infrastructure & Hardware Invariants Dashboard",
          "type": "link",
          "url": "/d/hardware_invariants"
        }
      ],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Service Health & Latency",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 1 },
          "id": 2,
          "title": "Prediction Request Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(taxon_predictions_total[1m]))",
              "legendFormat": "Requests / sec",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.05 }
                ]
              }
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 1 },
          "id": 3,
          "title": "Error Ratio (5m)",
          "type": "stat",
          "targets": [
            {
              "expr": "(sum(rate(taxon_predictions_total{status=~\"error|unavailable\"}[5m])) or vector(0)) / clamp_min(sum(rate(taxon_predictions_total[5m])), 1e-9)",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 80 },
                  { "color": "red", "value": 120 }
                ]
              }
            }
          },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 1 },
          "id": 4,
          "title": "p95 Inference Latency",
          "type": "timeseries",
          "targets": [
            {
              "expr": "1000 * histogram_quantile(0.95, sum by (le) (rate(taxon_inference_latency_seconds_bucket[5m])))",
              "legendFormat": "p95 Latency (ms)",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 8 },
          "id": 5,
          "title": "Statistical Drift & Manifold Exchangeability",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line" }
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 9 },
          "id": 6,
          "title": "Tier 1: Wasserstein-1 Distance vs Calibrated Threshold",
          "type": "timeseries",
          "targets": [
            {
              "expr": "taxon_drift_w1_distance",
              "legendFormat": "Observed W1",
              "refId": "A"
            },
            {
              "expr": "taxon_drift_w1_threshold",
              "legendFormat": "Threshold (tau_W1)",
              "refId": "B"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "custom": { "scaleDistribution": { "type": "log", "log": 10 } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.01 }
                ]
              }
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 9 },
          "id": 7,
          "title": "Tier 2: MMD² Permutation p-value",
          "type": "timeseries",
          "targets": [
            {
              "expr": "taxon_drift_mmd2_p_value",
              "legendFormat": "p-value (alpha=0.01)",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "In-Distribution (Healthy)", "color": "green" }, "1": { "text": "Drift Detected", "color": "red" } }, "type": "value" }
              ]
            }
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 9 },
          "id": 8,
          "title": "Active Drift Verdict",
          "type": "stat",
          "targets": [
            {
              "expr": "taxon_drift_detected",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "id": 9,
          "title": "Live Application Logs & Triage Traces",
          "type": "row"
        },
        {
          "datasource": { "type": "loki", "uid": "Loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 18 },
          "id": 10,
          "title": "Real-Time Inference Logs",
          "type": "logs",
          "options": {
            "showLabels": false,
            "showCommonLabels": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "editorMode": "code",
              "expr": "{job=\"taxon-vision\"}",
              "queryType": "range",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["taxon-vision", "mlops", "monitoring"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "TaxonVision MLOps - Production Overview",
      "uid": "taxon_overview",
      "version": 1
    }
