apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxon-vision-api
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: taxon-vision-api
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: taxon-vision-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxon-vision-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: api-service
        image: ghcr.io/foersben/taxon-vision-mlops:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: TAXON_SERVICE__PORT
          value: "8000"
        - name: TAXON_SERVICE__HOST
          value: "0.0.0.0"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: taxon-vision-api
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: taxon-vision-api
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taxon-vision-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
