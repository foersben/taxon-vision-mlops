apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxon-vision-serving
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: taxon-vision-serving
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: taxon-vision-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxon-vision-serving
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: api-service
        image: ghcr.io/foersben/taxon-vision-mlops:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 5"]
        env:
        - name: TAXON_SERVICE__PORT
          value: "8000"
        - name: TAXON_SERVICE__HOST
          value: "0.0.0.0"
        - name: TAXON_SERVICE__REDIS_URL
          value: "redis://redis-ephemeral.taxon-vision.svc.cluster.local:6379/0"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: "1536Mi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: checkpoints-volume
          mountPath: /app/models/checkpoints
          readOnly: true
        - name: flagged-observations-volume
          mountPath: /app/data/flagged_observations
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      volumes:
      - name: checkpoints-volume
        hostPath:
          path: /var/lib/taxon-vision/checkpoints
          type: DirectoryOrCreate
      - name: flagged-observations-volume
        hostPath:
          path: /var/lib/taxon-vision/flagged_observations
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: taxon-vision-serving
  namespace: taxon-vision
  labels:
    app.kubernetes.io/name: taxon-vision-serving
    app.kubernetes.io/part-of: taxon-vision-mlops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: taxon-vision-serving
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: 30080
    protocol: TCP
