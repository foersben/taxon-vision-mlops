# ==============================================================================
# TaxonVision-MLOps Docker Compose: Development Mode Overrides
# ==============================================================================
# Automatically loaded by `docker compose up`. Bind-mounts host source code and
# data directories for rapid iterative development and live hot-reloading.
# ==============================================================================

services:
  app:
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./config:/app/config

  pipeline-runner:
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./config:/app/config
      - ./dvc.yaml:/app/dvc.yaml
      - ./params.yaml:/app/params.yaml
