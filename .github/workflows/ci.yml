name: CI & Deployment Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request_target:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality-gate:
    name: Code, Security & Type Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAXON_ALLOW_UNTRAINED_FALLBACK: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Pixi Environment (CPU ci-dev)
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ci-dev

      - name: Hydrate Model Checkpoints from DVC
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mkdir -p models/checkpoints

          if [ -n "$DAGSHUB_TOKEN" ]; then
            echo ">>> Fetching latest model checkpoints from DagsHub DVC..."
            AWS_ACCESS_KEY_ID="$DAGSHUB_TOKEN" \
            AWS_SECRET_ACCESS_KEY="$DAGSHUB_TOKEN" \
            pixi run --frozen -e ci-dev dvc pull \
              models/checkpoints/head.pt \
              models/checkpoints/model_int8.onnx || true
          else
            echo "::notice::DAGSHUB_TOKEN not set in GitHub Actions; running tests with offline fixtures."
          fi

      - name: Pre-Commit Quality Checks
        run: SKIP=enforce-author-identity,openwiki-sync pixi run --frozen -e ci-dev pre-commit run --all-files

      - name: Validate Open Knowledge Format (OKF v0.2)
        run: pixi run --frozen -e ci-dev python scripts/validate_okf.py

      - name: Pass 1 - Unit Tests & Coverage
        run: |
          pixi run --frozen -e ci-dev pytest tests/ --cov=src/taxon_vision --cov-report=xml --cov-fail-under=80 -o "addopts="

      - name: Pass 2 - Integration & Conformal Invariants
        run: |
          pixi run --frozen -e ci-dev pytest tests/integration/ tests/invariants/ -x -q -o "addopts="

  cognitive-complexity:
    name: Complexipy Cognitive Complexity
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ci-dev

      - name: Run Complexipy Scan
        run: |
          [ -d .cache/.complexity_cache ] && mv .cache/.complexity_cache .complexipy_cache || true
          pixi run --frozen -e ci-dev complexipy src/ --output-format sarif --output metrics-results.sarif --ignore-complexity
          pixi run --frozen -e ci-dev complexipy src/ --failed || true

      - name: Upload Bottlenecks to GitHub Code Scanning
        if: "!env.ACT"
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: metrics-results.sarif

  architectural-profiling:
    name: Architecture & Line Count Profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate SCC Report
        run: docker run --rm -v "${{ github.workspace }}:/pwd:ro" ghcr.io/boyter/scc:master scc --exclude-dir examples,scratch /pwd

  deploy-docs:
    name: Build & Deploy Documentation
    needs: [quality-gate, cognitive-complexity]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pixi Environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ci-dev

      - name: Generate OKF Knowledge Graph Visualization
        run: pixi run --frozen -e ci-dev python scripts/visualize_okf.py

      - name: Build Docs with Zensical
        run: pixi run --frozen -e ci-dev zensical build --strict

      - name: Upload Pages Artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v5

  build-and-push-container:
    name: Build & Publish Serving Container (GHCR)
    needs: [quality-gate, cognitive-complexity]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Pixi Environment (CPU ci-dev)
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ci-dev

      - name: Hydrate Model Checkpoints from DVC
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mkdir -p models/checkpoints
          if [ -n "$DAGSHUB_TOKEN" ]; then
            echo ">>> Fetching latest model checkpoints from DagsHub DVC..."
            AWS_ACCESS_KEY_ID="$DAGSHUB_TOKEN" \
            AWS_SECRET_ACCESS_KEY="$DAGSHUB_TOKEN" \
            pixi run --frozen -e ci-dev dvc pull \
              models/checkpoints/head.pt \
              models/checkpoints/model_int8.onnx || true
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ !env.ACT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
