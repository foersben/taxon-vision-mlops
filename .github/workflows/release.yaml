name: Release & Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
      draft:
        description: "Create draft release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-verify:
    name: Build & Validate Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pixi Environment (CPU ci-dev)
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ci-dev

      - name: Verify Version Consistency
        run: |
          PKG_VERSION=$(pixi run --frozen -e ci-dev python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          INIT_VERSION=$(pixi run --frozen -e ci-dev python -c "import taxon_vision; print(taxon_vision.__version__)")

          if [ "$PKG_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::Version mismatch: pyproject.toml ($PKG_VERSION) does not match taxon_vision.__version__ ($INIT_VERSION)"
            exit 1
          fi

          TARGET_TAG="${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}"
          if [ -n "$TARGET_TAG" ] && [ "$TARGET_TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Tag mismatch: Release tag ($TARGET_TAG) does not match package version (v$PKG_VERSION)"
            exit 1
          fi

      - name: Build Distribution Wheel
        run: |
          mkdir -p dist
          pixi run --frozen -e ci-dev pip wheel --no-deps -w dist .

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum *.whl > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify Wheel Integrity
        run: |
          pixi run --frozen -e ci-dev python -m zipfile -t dist/*.whl
          pixi run --frozen -e ci-dev python -m zipfile -l dist/*.whl

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution-package
          path: dist/
          retention-days: 5

  publish-release:
    name: Publish GitHub Release
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distribution-package
          path: dist

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ contains(github.event.inputs.tag_name || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
