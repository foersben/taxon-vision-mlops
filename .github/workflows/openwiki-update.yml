name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 08:00 UTC.
    - cron: "0 8 * * 1"

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to compare against OpenWiki's previous documented commit.
          ref: develop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install OpenWiki
        run: |
          npm install --global \
            openwiki@0.7.2 \
            mermaid@12.2.0 \
            jsdom@30.1.3

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENWIKI_MODEL_ID: "gemini-3.8-flash"

          # Required only if using the LangSmith connector.
          OPENWIKI_LANGSMITH_API_KEY: ${{ secrets.OPENWIKI_LANGSMITH_API_KEY }}

          # Optional: trace OpenWiki's own execution.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"

      - name: Remove transient OpenWiki run state
        if: ${{ always() }}
        run: rm -f -- openwiki/.run.json

      - name: List OpenWiki update paths
        id: paths
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          paths="openwiki"

          if [ -e AGENTS.md ]; then
            # Normalise OpenWiki list bullets to asterisks per repository Rule 04
            sed -i '/<!-- OPENWIKI:START -->/,/<!-- OPENWIKI:END -->/ s/^- /* /' AGENTS.md
            paths="$paths,AGENTS.md"
          fi

          echo "list=$paths" >> "$GITHUB_OUTPUT"

      - name: Create OpenWiki update pull request
        id: create-pr
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: ${{ steps.paths.outputs.list }}
          base: develop
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            If generation failed, this PR may contain partial progress.
            Review the affected pages and workflow logs before merging.

      - name: Annotate update pull request
        if: ${{ !cancelled() && steps.create-pr.outputs.pull-request-url != '' }}
        run: |
          echo "::notice title=OpenWiki update pull request::${{ steps.create-pr.outputs.pull-request-url }}"

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
