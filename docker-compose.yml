
# ==============================================================================
# TaxonVision-MLOps Multi-Microservice Orchestration
# ==============================================================================
# Deploys the complete containerized stack:
# 1. traefik: Edge reverse proxy with native Prometheus metrics (ports 80, 8081, 9100)
# 2. app: FastAPI inference service & Jinja2/HTMX dashboard (port 8000 & routed via :80)
# 3. seaweedfs: S3-compatible local object storage (port 8333 S3, 9333 Master UI)
# 4. optuna-dashboard: Bayesian hyperparameter optimization visualizer (port 8080)
# 5. prometheus: Real-time time-series telemetry scraping /metrics (port 9090)
# 6. grafana: Operational metrics dashboards (port 3000, admin/admin)
# 7. airflow: Airflow 3 orchestrator with LocalExecutor (port 8090 UI/API)
# ==============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:3.0.0-python3.12
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:taxon_airflow_pass@postgres:5432/airflow"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW__CORE__FERNET_KEY:-4mR_YgD-9XqjZ8V-V1KkL7mNpQrStUvWxYz01234567=}"
    AIRFLOW__API__AUTH_JWT_SECRET: "${AIRFLOW__API__AUTH_JWT_SECRET:-taxon_vision_airflow_jwt_secret_key_32bytes}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__MIN_FILE_PROCESS_INTERVAL: "60"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    TAXON_INTERNAL_API_TOKEN: "${TAXON_INTERNAL_API_TOKEN:-dev_internal_token_secret}"
    AIRFLOW_CONN_TAXON_APP: '{"conn_type": "http", "host": "http://app:8000", "password": "${TAXON_INTERNAL_API_TOKEN:-dev_internal_token_secret}"}'
    AIRFLOW_CONN_JENKINS: '${AIRFLOW_CONN_JENKINS:-{"conn_type": "http", "host": "http://hive-mind:8080", "login": "admin", "password": "jenkins_api_token"}}'
    PYTHONPATH: "/opt/airflow/src"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./data/airflow/logs:/opt/airflow/logs
    - ./src:/opt/airflow/src:ro
    - ./config:/opt/airflow/config:ro
    - ./data/manifests:/opt/airflow/data/manifests
    - ./data/flagged_observations:/opt/airflow/data/flagged_observations
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  traefik:
    image: traefik:v3.1
    container_name: taxon_traefik
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.metrics.address=:9100"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addentrypointslabels=true"
      - "--metrics.prometheus.addserviceslabels=true"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8088}:80" # Public HTTP entrypoint (default 8088 avoids rootless port 80 permission denied)
      - "8081:8080" # Traefik Web UI & Dashboard
      - "9100:9100" # Traefik Prometheus metrics port
    volumes:
      - "${DOCKER_SOCK:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock:ro"
      - ./data/logs/traefik:/var/log/traefik
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: taxon_vision_app
    ports:
      - "${APP_PORT:-8001}:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=PathPrefix(`/`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - TAXON_OPTUNA_STORAGE_URI=postgresql+psycopg://optuna:taxon_optuna_pass@postgres:5432/optuna
      - TAXON_TELEMETRY__DATABASE_URL=postgresql+psycopg://telemetry:taxon_telemetry_pass@postgres:5432/telemetry
      - TAXON_ALLOW_UNTRAINED_FALLBACK=true
      - TAXON_RETRAIN_WEBHOOK_SECRET=${TAXON_RETRAIN_WEBHOOK_SECRET:-dev-secret-token}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-https://dagshub.com/foersben/taxon-vision-mlops.mlflow}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN:-}
    volumes:
      - ./src:/app/src:ro
      - ./data/flagged_observations:/app/data/flagged_observations
      - ./models/checkpoints:/app/models/checkpoints
      - ./data/sample:/app/data/sample
      - ./data/embeddings:/app/data/embeddings:ro
      - ./data/logs:/app/data/logs
    depends_on:
      seaweedfs:
        condition: service_started
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pixi", "run", "--frozen", "-e", "ci", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  pipeline-runner:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: taxon_pipeline_runner
    profiles: ["pipeline"]
    restart: "no"
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-https://dagshub.com/foersben/taxon-vision-mlops.mlflow}
      - DAGSHUB_TOKEN=${DAGSHUB_TOKEN:-}
      - TAXON_TELEMETRY__DATABASE_URL=postgresql+psycopg://telemetry:taxon_telemetry_pass@postgres:5432/telemetry
      - TAXON_OPTUNA_STORAGE_URI=postgresql+psycopg://optuna:taxon_optuna_pass@postgres:5432/optuna
    command: ["pixi", "run", "--frozen", "-e", "dev", "dvc", "repro", "train", "export", "calibrate", "evaluate"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: taxon_seaweedfs
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # Master UI
      - "8888:8888" # Filer UI
    command: "server -dir=/data -s3 -s3.port=8333 -s3.allowEmptyFolder=true"
    volumes:
      - ./data/seaweedfs:/data
    restart: unless-stopped

  optuna-dashboard:
    image: ghcr.io/optuna/optuna-dashboard:latest
    container_name: taxon_optuna_dashboard
    ports:
      - "8080:8080"
    command: ["postgresql+psycopg2://optuna:taxon_optuna_pass@postgres:5432/optuna", "--port", "8080", "--host", "0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: taxon_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: taxon_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TAXON_RETRAIN_WEBHOOK_SECRET=${TAXON_RETRAIN_WEBHOOK_SECRET:-dev-secret-token}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: taxon_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: taxon_promtail
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./config/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - ./data/logs:/var/log/app:ro
      - ./data/logs/traefik:/var/log/traefik:ro
      - ./data/airflow/logs:/var/log/airflow:ro
    depends_on:
      - loki
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: taxon_postgres
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: taxon_super_secret
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: taxon_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create \
          --username admin \
          --firstname Admin \
          --lastname Taxon \
          --role Admin \
          --email admin@taxon-vision.org \
          --password admin || true)
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: taxon_airflow_apiserver
    command: api-server
    ports:
      - "8090:8080"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health')\" 2>/dev/null || curl -sI http://localhost:8080/health || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: taxon_airflow_scheduler
    command: scheduler
    mem_limit: 1024m
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: taxon_airflow_dag_processor
    command: dag-processor
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
