<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHIDS Knowledge Graph Explorer (OKF v0.2)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #f3f4f6;
      --text-dim: #9ca3af;
      --accent: #ff5722;
      --accent-cyan: #00e5ff;
      --accent-purple: #b388ff;
      --accent-green: #00e676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    #cy {
      flex: 1;
      height: 100%;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
    }

    #sidebar {
      width: 380px;
      height: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
      z-index: 10;
      box-shadow: -4px 0 24px rgba(0,0,0,0.5);
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .header-sub {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    .search-box {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus {
      border-color: var(--accent-cyan);
    }

    .stats-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-badge {
      flex: 1;
      padding: 8px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      text-align: center;
      font-size: 0.75rem;
      border: 1px solid var(--border-color);
    }
    .stat-badge strong {
      display: block;
      font-size: 1.1rem;
      color: var(--accent-cyan);
    }

    #details-panel {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
    }

    .concept-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-top: 10px;
    }

    .concept-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tag {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(0, 229, 255, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    .tag.tier {
      background: rgba(0, 230, 118, 0.15);
      color: var(--accent-green);
      border-color: rgba(0, 230, 118, 0.3);
    }

    .concept-desc {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #d1d5db;
      margin-bottom: 14px;
    }

    .meta-item {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .meta-item b {
      color: #e5e7eb;
    }
  </style>
</head>
<body>
  <div id="cy"></div>
  <div id="sidebar">
    <div class="header-title">PHIDS Knowledge Graph</div>
    <div class="header-sub">Open Knowledge Format (OKF v0.2) Explorer</div>

    <input type="text" id="search" class="search-box" placeholder="Search concepts, types, rules..." />

    <div class="stats-row">
      <div class="stat-badge"><strong id="node-count">0</strong>Nodes</div>
      <div class="stat-badge"><strong id="edge-count">0</strong>Edges</div>
    </div>

    <div id="details-panel">
      <div style="font-size:0.85rem; color: var(--text-dim); text-align: center; margin-top: 40px;">
        Click any node in the graph to inspect its OKF frontmatter, trust tier, and cross-links.
      </div>
    </div>
  </div>

  <script>
    const graphData = {"nodes": [{"data": {"id": "docs/foundations/concept_design.md", "label": "Concept Design & Architectural Specification", "type": "Concept", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Conceptual design and LaTeX documentation specification for TaxonVision-MLOps across 6 architectural chapters."}}, {"data": {"id": "docs/foundations/inaturalist_data_ecosystem.md", "label": "iNaturalist Data Ecosystem & Open Licensing", "type": "Concept", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Overview of iNaturalist API rate limits, AWS Open Data buckets, and CC licensing."}}, {"data": {"id": "docs/foundations/taxonomy_and_darwincore.md", "label": "Taxonomy & DarwinCore Standards", "type": "Concept", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Biological taxonomy models and DarwinCore observation standards."}}, {"data": {"id": "docs/index.md", "label": "TaxonVision-MLOps Architecture & Platform Overview", "type": "Concept", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Executive overview of the TaxonVision-MLOps automated species identification service."}}, {"data": {"id": "docs/mlops_pipeline/backbone_benchmarking_pareto.md", "label": "Backbone Benchmarking & Pareto Trade-Offs", "type": "Reference", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Pareto analysis comparing candidate extractors on accuracy, latency, and cloud cost."}}, {"data": {"id": "docs/mlops_pipeline/ingestion_and_versioning.md", "label": "Ingestion & Dataset Versioning with DVC", "type": "System Pattern", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Data ingestion and reproducible versioning strategies using DVC and S3."}}, {"data": {"id": "docs/mlops_pipeline/onnx_optimization_and_latency.md", "label": "ONNX Runtime Optimization & Dynamic Quantization", "type": "System Pattern", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Inference acceleration using ONNX Runtime and INT8 dynamic quantization."}}, {"data": {"id": "docs/operations/api_reference.md", "label": "FastAPI Service & OpenAPI Contract Reference", "type": "Reference", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "REST endpoints, request schemas, and response contracts."}}, {"data": {"id": "docs/operations/deployment_runbook.md", "label": "Deployment Runbook & Containerization", "type": "Reference", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Operational instructions for building Docker images and running production services."}}, {"data": {"id": "docs/operations/prometheus_and_observability.md", "label": "Prometheus Telemetry & Drift Observability", "type": "Reference", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Telemetry metrics, latency histograms, and embedding drift monitors."}}, {"data": {"id": "docs/uncertainty_and_safety/active_learning_and_hitl.md", "label": "Active Learning & Human-in-the-Loop Triage", "type": "Concept", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Active learning query strategies maximizing marginal information value per human review hour."}}, {"data": {"id": "docs/uncertainty_and_safety/conformal_prediction_theory.md", "label": "Conformal Prediction Theory & Coverage Guarantees", "type": "Specification", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Split conformal prediction mathematics guaranteeing marginal coverage error bounds."}}, {"data": {"id": "docs/uncertainty_and_safety/ood_and_empty_frame_detection.md", "label": "Out-Of-Distribution & Empty Frame Detection", "type": "Specification", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Energy-based scoring for identifying non-organism and uninformative images."}}, {"data": {"id": ".agents/AGENTS.md", "label": "TaxonVision Routing & Capabilities", "type": "Reference", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Primary routing table for AI IDEs defining roles in .agents/roles/ and core MLOps constraints."}}, {"data": {"id": ".agents/PROMPT_TEMPLATE.md", "label": "Jules Standard Prompt Appendix", "type": "Reference", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Copy-paste prompt appendix for Jules cloud sessions."}}, {"data": {"id": ".agents/README.md", "label": "TaxonVision Autonomous Agent Ecosystem Architecture", "type": "Documentation", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Comprehensive architecture, operational protocols, and role directory for TaxonVision multi-agent development ecosystem."}}, {"data": {"id": ".agents/index.md", "label": "TaxonVision Agent Ecosystem - Algorithmic Decision Matrix", "type": "Directory Index", "status": "stable", "trust_tier": "Unverified", "description": ""}}, {"data": {"id": ".agents/log.md", "label": ".Agents Log", "type": "Update Log", "status": "stable", "trust_tier": "Unverified", "description": ""}}, {"data": {"id": ".agents/roles/01-orchestrator.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "PM. Deconstructs user requests, enforces OKF graph structure and cross-cutting milestones."}}, {"data": {"id": ".agents/roles/02-taxonomic-architect.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Translates biological taxonomy, DarwinCore standards, and GBIF occurrence schemas."}}, {"data": {"id": ".agents/roles/03-mlops-data-engineer.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Builds streaming S3 ingestion, DVC versioning, and open-license attribution filters."}}, {"data": {"id": ".agents/roles/04-model-engineer.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Implements Timm backbone extractors (DINOv3, BioCLIP-2, DINOv2, MobileNetV4), classification heads, and Class-Balanced Loss."}}, {"data": {"id": ".agents/roles/05-inference-optimizer.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Designs zero-allocation ONNX Runtime inference engines, quantization, and Grad-CAM."}}, {"data": {"id": ".agents/roles/06-uncertainty-safety-engineer.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Calibrates Split Conformal Prediction error guarantees and energy-based OOD detectors."}}, {"data": {"id": ".agents/roles/07-active-learning-engineer.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Builds BADGE/CoreSet acquisition functions and human review triage queues."}}, {"data": {"id": ".agents/roles/08-observability-engineer.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Maintains Prometheus metrics, embedding drift detection, and Pareto benchmarks."}}, {"data": {"id": ".agents/roles/09-api-and-ui-developer.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Develops FastAPI endpoints, async upload routes, and Jinja2/HTMX dashboards."}}, {"data": {"id": ".agents/roles/10-qa-automator.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Builds deterministic CUB-200 fixtures, hypothesis property tests, and CI test passes."}}, {"data": {"id": ".agents/roles/11-docs-librarian.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Maintains Zensical documentation, KaTeX formulas, and OKF knowledge graph links."}}, {"data": {"id": ".agents/roles/12-git-operator.md", "label": "Directives", "type": "Agent Role", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Manages git branches, enforces GPG/SSH commit signatures, and handles release tagging."}}, {"data": {"id": ".agents/rules/00-python-modernization.md", "label": "Mandates", "type": "Agent Rule", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Solely rely on Pixi (.pixi/). Ban pip, poetry, uv, and .venv creation."}}, {"data": {"id": ".agents/rules/01-mlops-reproducibility.md", "label": "Mandates", "type": "Agent Rule", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Deterministic PRNG seeding, DVC dataset immutability, and SHA256 verification."}}, {"data": {"id": ".agents/rules/02-inference-latency-invariants.md", "label": "Mandates", "type": "Agent Rule", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Zero memory allocations on hot inference path and strict p95 latency budgets."}}, {"data": {"id": ".agents/rules/03-git-security-and-signing.md", "label": "Mandates", "type": "Agent Rule", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Mandatory GPG/SSH commit signing. Escalation on verification failure."}}, {"data": {"id": ".agents/rules/04-markdown-formatting.md", "label": "Mandates", "type": "Agent Rule", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Global markdown rules: standard hyphens, asterisk lists, 4-space indentation, and clean spacing."}}, {"data": {"id": ".agents/rules/05-open-license-compliance.md", "label": "Mandates", "type": "Agent Rule", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Only CC0, CC-BY, CC-BY-NC licenses allowed. Rejection of un-licensed static domain."}}, {"data": {"id": ".agents/rules/06-conformal-coverage-invariants.md", "label": "Mandates", "type": "Agent Rule", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Empirical coverage must mathematically satisfy 1 - alpha bound on holdout."}}, {"data": {"id": ".agents/skills/audit-license-compliance/SKILL.md", "label": "Audit License Compliance", "type": "Agent Skill", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Skill to verify open licenses and attribution retention."}}, {"data": {"id": ".agents/skills/run-pareto-benchmarks/SKILL.md", "label": "Run Pareto Benchmarks", "type": "Agent Skill", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Skill to evaluate candidate backbone (DINOv3, BioCLIP-2, DINOv2, MobileNetV4) accuracy vs latency vs cost."}}, {"data": {"id": ".agents/skills/validate-okf/SKILL.md", "label": "Validate Open Knowledge Format", "type": "Agent Skill", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Skill to verify that markdown files contain correct frontmatter."}}, {"data": {"id": ".agents/skills/verify-conformal-coverage/SKILL.md", "label": "Verify Conformal Coverage", "type": "Agent Skill", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Skill to assert empirical coverage meets nominal 1 - alpha rate."}}, {"data": {"id": ".agents/skills/visualize-okf/SKILL.md", "label": "Visualize Open Knowledge Format", "type": "Agent Skill", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Skill to generate interactive D3 knowledge graph visualization."}}, {"data": {"id": ".agents/workflows/active-learning-cycle.md", "label": "Active Learning Cycle", "type": "Workflow", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Executes sample query ranking, human annotation ingestion, and retraining trigger."}}, {"data": {"id": ".agents/workflows/conformal-uncertainty-audit.md", "label": "Conformal Uncertainty Audit", "type": "Workflow", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Verifies statistical coverage guarantees and human referral rates."}}, {"data": {"id": ".agents/workflows/doc-synchronization-pipeline.md", "label": "Doc Synchronization Pipeline", "type": "Workflow", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Audits and synchronizes Zensical documentation against codebase changes."}}, {"data": {"id": ".agents/workflows/full-pipeline-validation.md", "label": "Full Pipeline Validation", "type": "Workflow", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Coordinated pipeline executing lint, type checks, unit tests, coverage, and doc build."}}, {"data": {"id": ".agents/workflows/jules-session-triage.md", "label": "Jules Session Triage", "type": "Workflow", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Protocol for triaging, reviewing, and cleaning up background Jules sessions."}}, {"data": {"id": ".agents/workflows/model-benchmark-pareto.md", "label": "Model Benchmark Pareto", "type": "Workflow", "status": "stable", "trust_tier": "Machine-Confirmed", "description": "Protocol for evaluating accuracy vs latency vs cost across candidate backbones."}}], "edges": [{"data": {"id": ".agents/index.md->.agents/workflows/jules-session-triage.md", "source": ".agents/index.md", "target": ".agents/workflows/jules-session-triage.md"}}, {"data": {"id": ".agents/index.md->.agents/workflows/conformal-uncertainty-audit.md", "source": ".agents/index.md", "target": ".agents/workflows/conformal-uncertainty-audit.md"}}, {"data": {"id": ".agents/index.md->.agents/workflows/full-pipeline-validation.md", "source": ".agents/index.md", "target": ".agents/workflows/full-pipeline-validation.md"}}, {"data": {"id": ".agents/index.md->.agents/workflows/model-benchmark-pareto.md", "source": ".agents/index.md", "target": ".agents/workflows/model-benchmark-pareto.md"}}, {"data": {"id": ".agents/index.md->.agents/workflows/doc-synchronization-pipeline.md", "source": ".agents/index.md", "target": ".agents/workflows/doc-synchronization-pipeline.md"}}, {"data": {"id": ".agents/index.md->.agents/workflows/active-learning-cycle.md", "source": ".agents/index.md", "target": ".agents/workflows/active-learning-cycle.md"}}]};

    document.getElementById('node-count').innerText = graphData.nodes.length;
    document.getElementById('edge-count').innerText = graphData.edges.length;

    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [...graphData.nodes, ...graphData.edges],
      style: [
        {
          selector: 'node',
          style: {
            'label': 'data(label)',
            'color': '#f3f4f6',
            'font-size': '10px',
            'text-valign': 'bottom',
            'text-margin-y': 4,
            'background-color': function(ele) {
              const type = ele.data('type');
              if (type === 'Attested Computation') return '#ff5722';
              if (type === 'Scientific Model') return '#00e5ff';
              if (type === 'Architecture Document') return '#b388ff';
              if (type === 'Agent Role') return '#ffd600';
              if (type === 'Behavioral Rule') return '#ff1744';
              if (type === 'Directory Index') return '#78909c';
              return '#4caf50';
            },
            'border-width': 2,
            'border-color': function(ele) {
              const tier = ele.data('trust_tier');
              if (tier === 'Human-Reviewed') return '#00e676';
              if (tier === 'Machine-Confirmed') return '#00e5ff';
              return 'rgba(255,255,255,0.2)';
            },
            'width': 24,
            'height': 24
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 1.2,
            'line-color': 'rgba(255,255,255,0.18)',
            'target-arrow-color': 'rgba(255,255,255,0.25)',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier',
            'arrow-scale': 0.6
          }
        },
        {
          selector: '.highlighted',
          style: {
            'background-color': '#ffff00',
            'border-width': 4,
            'border-color': '#ffffff'
          }
        }
      ],
      layout: {
        name: 'cose',
        animate: false,
        padding: 50,
        nodeRepulsion: 4500,
        idealEdgeLength: 60
      }
    });

    cy.on('tap', 'node', function(evt) {
      const node = evt.target;
      const data = node.data();

      const panel = document.getElementById('details-panel');
      panel.innerHTML = `
        <div class="concept-card">
          <div class="concept-title">${data.label}</div>
          <div class="tag-list">
            <span class="tag">${data.type}</span>
            <span class="tag tier">${data.trust_tier}</span>
            <span class="tag">${data.status}</span>
          </div>
          <div class="concept-desc">${data.description || '<i>No description declared.</i>'}</div>
          <div class="meta-item"><b>Asset Path:</b> <code>${data.id}</code></div>
        </div>
      `;
    });

    document.getElementById('search').addEventListener('input', function(e) {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        cy.nodes().removeClass('highlighted');
        return;
      }
      cy.nodes().forEach(n => {
        const d = n.data();
        const match = d.label.toLowerCase().includes(q) ||
                      d.type.toLowerCase().includes(q) ||
                      d.id.toLowerCase().includes(q);
        if (match) {
          n.addClass('highlighted');
        } else {
          n.removeClass('highlighted');
        }
      });
    });
  </script>
</body>
</html>
