[project]
site_name = "TaxonVision-MLOps Architecture & Engineering Portal"
site_description = "Enterprise Biodiversity Computer Vision, Split Conformal Prediction, Vision-RAG & Bare-Metal Kubernetes MLOps"
site_url = "https://foersben.github.io/taxon-vision-mlops/"
repo_name = "foersben/taxon-vision-mlops"
repo_url = "https://github.com/foersben/taxon-vision-mlops"
edit_uri = "edit/develop/docs/"
docs_dir = "docs"
site_dir = "site"
language = "en"

exclude_docs = """
/.archive/
/latex/**/*.tex
/latex/**/*.aux
/latex/**/*.log
/latex/**/*.nav
/latex/**/*.out
/latex/**/*.snm
/latex/**/*.toc
/latex/**/Makefile
"""

watch = [
    "dvc.yaml",
    "params.yaml",
    "Justfile",
    "Jenkinsfile",
    "config/",
    "src/taxon_vision/",
    "reports/",
    ".agents/",
]

extra_css = ["stylesheets/extra.css"]

extra_javascript = [
    "javascripts/katex.js",
    "https://unpkg.com/katex@0/dist/katex.min.js",
    "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
    "javascripts/mermaid.js",
    "javascripts/interactive_widgets.js",
]

[project.theme]
variant = "modern"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.path",
    "navigation.indexes",
    "navigation.top",
    "search.suggest",
    "search.highlight",
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.code.annotate",
    "content.tabs.link",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep-orange"
[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "deep-orange"
[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true, toc_depth = 4 }
"pymdownx.details" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.caret" = {}
"pymdownx.mark" = {}
"pymdownx.tilde" = {}
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.tasklist" = { custom_checkbox = true }
"pymdownx.arithmatex" = { generic = true }
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.snippets" = { base_path = [".", "docs"], check_paths = true }
"pymdownx.superfences" = { preserve_tabs = true, custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
] }

# ==============================================================================
# Navigation Hierarchy (7 Top-Level Tabs)
# ==============================================================================

