[project]
site_name = "TaxonVision-MLOps"
site_description = "Automated End-to-End MLOps Pipeline for Species Identification from Photographs"
site_url = "https://foersben.github.io/taxon-vision-mlops/"
repo_name = "foersben/taxon-vision-mlops"
repo_url = "https://github.com/foersben/taxon-vision-mlops"
docs_dir = "docs"
site_dir = "site"
language = "en"

extra_css = ["https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"]
extra_javascript = [
    "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js",
    "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js",
    "https://unpkg.com/mermaid@10/dist/mermaid.min.js",
    "javascripts/katex.js",
    "javascripts/mermaid.js",
]

[project.theme]
variant = "modern"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "toc.integrate",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
]

[project.theme.palette]
scheme = "slate"
primary = "black"
accent = "deep-orange"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions]
admonition = {}
tables = {}
attr_list = {}
"pymdownx.details" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = {}
toc = { permalink = true }
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.tasklist" = { custom_checkbox = true }
"pymdownx.arithmatex" = { generic = true }
"pymdownx.superfences" = { custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
] }

[[project.nav]]
Home = "index.md"

[[project.nav]]
"Foundations" = [
    { "Chapter Overview" = "foundations/index.md" },
    { "Taxonomy & DarwinCore" = "foundations/taxonomy_and_darwincore.md" },
    { "iNaturalist Data Ecosystem" = "foundations/inaturalist_data_ecosystem.md" },
    { "Curriculum vs. Production Strategy" = "foundations/architectural_comparison.md" },
]

[[project.nav]]
"Data & MLOps Pipelines" = [
    { "Chapter Overview" = "mlops_pipeline/index.md" },
    { "Dual Pipeline Topology" = "mlops_pipeline/dual_pipeline_architecture.md" },
    { "Ingestion & Versioning" = "mlops_pipeline/ingestion_and_versioning.md" },
]

[[project.nav]]
"Model Engineering & Inference" = [
    { "Chapter Overview" = "model_engineering/index.md" },
    { "Vision Model Architecture" = "model_engineering/model_architecture.md" },
    { "Training Pipeline" = "model_engineering/training_pipeline.md" },
    { "Backbone Pareto Benchmarks" = "model_engineering/backbone_benchmarking_pareto.md" },
    { "ONNX Runtime Optimization" = "model_engineering/onnx_optimization_and_latency.md" },
]

[[project.nav]]
"Uncertainty & Safety" = [
    { "Chapter Overview" = "uncertainty_and_safety/index.md" },
    { "Conformal Prediction Theory" = "uncertainty_and_safety/conformal_prediction_theory.md" },
    { "OOD & Empty Frame Detection" = "uncertainty_and_safety/ood_and_empty_frame_detection.md" },
    { "Active Learning & Human Review" = "uncertainty_and_safety/active_learning_and_hitl.md" },
]

[[project.nav]]
"Operations & Deployment" = [
    { "Chapter Overview" = "operations/index.md" },
    { "Current Infrastructure" = "operations/current_infrastructure.md" },
    { "Jenkins CI/CD Infrastructure" = "operations/jenkins_ci_infrastructure.md" },
    { "GPU Resource Scheduling" = "operations/gpu_resource_scheduling.md" },
    { "Deployment Runbook" = "operations/deployment_runbook.md" },
    { "Prometheus Observability" = "operations/prometheus_and_observability.md" },
    { "API Reference" = "operations/api_reference.md" },
    { "Implementation Roadmap" = "operations/implementation_status.md" },
]

[project.plugins.htmlproofer]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_source = true
heading_level = 2
show_signature_annotations = true
