"Home & Interactive Hub" = [
    { "Platform Overview" = "index.md" },
    { "Interactive Architecture Hub" = "interactive_hub.md" },
]

[[project.nav]]
"Foundations & Domain" = [
    { "Chapter Overview" = "foundations/index.md" },
    { "iNaturalist Data Ecosystem" = "foundations/inaturalist_data_ecosystem.md" },
    { "Taxonomy & DarwinCore" = "foundations/taxonomy_and_darwincore.md" },
    { "Architectural Comparison" = "foundations/architectural_comparison.md" },
    { "System Reference" = "foundations/system_reference.md" },
]

[[project.nav]]
"Software & Config Architecture" = [
    { "Chapter Overview" = "architecture/index.md" },
    { "Repository & Config Encyclopedia" = "architecture/repository_and_config_encyclopedia.md" },
    { "Package & Call Graph" = "architecture/package_and_call_graph.md" },
    { "Codebase Explorer" = "architecture/codebase_explorer.md" },
]

[[project.nav]]
"MLOps Pipeline & Storage" = [
    { "Chapter Overview" = "mlops_pipeline/index.md" },
    { "Dual Pipeline Architecture" = "mlops_pipeline/dual_pipeline_architecture.md" },
    { "Ingestion & Versioning" = "mlops_pipeline/ingestion_and_versioning.md" },
    { "Storage & Database Tiers" = "mlops_pipeline/storage_and_databases.md" },
    { "DVC DAG Explorer" = "mlops_pipeline/dvc_dag_explorer.md" },
]

[[project.nav]]
"Model & Inference Engineering" = [
    { "Chapter Overview" = "model_engineering/index.md" },
    { "Model Architecture" = "model_engineering/model_architecture.md" },
    { "Training Pipeline" = "model_engineering/training_pipeline.md" },
    { "ONNX Optimization & Latency" = "model_engineering/onnx_optimization_and_latency.md" },
    { "Backbone Pareto Benchmarking" = "model_engineering/backbone_benchmarking_pareto.md" },
]

[[project.nav]]
"Epistemic Safety & Vision-RAG" = [
    { "Chapter Overview" = "uncertainty_and_safety/index.md" },
    { "Conformal Prediction Theory" = "uncertainty_and_safety/conformal_prediction_theory.md" },
    { "Calibration Layers Deep Dive" = "uncertainty_and_safety/calibration_layers_deep_dive.md" },
    { "OOD & Empty Frame Detection" = "uncertainty_and_safety/ood_and_empty_frame_detection.md" },
    { "Interactive Conformal Simulator" = "uncertainty_and_safety/interactive_simulator.md" },
    { "Active Learning & Human Review" = "uncertainty_and_safety/active_learning_and_hitl.md" },
    { "MMKG & Vision-RAG" = "uncertainty_and_safety/mmkg_and_vision_rag.md" },
]

[[project.nav]]
"Operations & Governance" = [
    { "Chapter Overview" = "operations/index.md" },
    { "Current Infrastructure" = "operations/current_infrastructure.md" },
    { "GPU Resource Scheduling" = "operations/gpu_resource_scheduling.md" },
    { "Jenkins CI/CD Infrastructure" = "operations/jenkins_ci_infrastructure.md" },
    { "Deployment Runbook" = "operations/deployment_runbook.md" },
    { "Prometheus Observability" = "operations/prometheus_and_observability.md" },
    { "API Reference" = "operations/api_reference.md" },
    { "Agentic Governance & OKF" = "operations/agentic_governance_and_okf.md" },
    { "Implementation Status" = "operations/implementation_status.md" },
]

[project.plugins.htmlproofer]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_source = true
heading_level = 2
show_signature_annotations = true
